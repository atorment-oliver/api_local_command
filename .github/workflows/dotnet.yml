name: Build Visual Studio solution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore .NET project
        run: dotnet restore ApiLocalCommand.csproj
      - name: Build API and MDB solution (x64)
        run: msbuild ApiLocalCommand.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Verify native DLL is copied beside the API
        shell: pwsh
        run: |
          $dll = "bin/Release/net8.0/ComandosMDB.dll"
          if (!(Test-Path $dll)) { throw "ComandosMDB.dll was not copied to the API output: $dll" }
